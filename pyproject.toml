[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parrot-neuro"
version = "0.1.0"
description = "Local-dev API over the Parrot forward-modeling pipeline outputs (Subject accessor)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Christian Buda", email = "chrichri975@gmail.com" }]

# Core deps only. The Subject facade resolves paths with the stdlib and loads the
# common file types with these three. Heavier readers (mne, nilearn, ...) are NOT
# pulled in -- add them if/when the API grows a stage that needs them.
dependencies = [
    "numpy",
    "nibabel",
    "trimesh",
]

# The `parrot_neuro.optimization` subpackage (TVB neural-mass -> EEG/BOLD fitting)
# needs a much heavier stack. It is never imported by `import parrot_neuro`, so
# these stay optional: install with `pip install parrot-neuro[optim]` (the pixi
# dev environment already provides them).
[project.optional-dependencies]
optim = [
    "jax",
    "tvboptim",
    "optax",
    "equinox",
    "scipy",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parrot_neuro"]
