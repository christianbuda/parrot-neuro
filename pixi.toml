[workspace]
authors = ["Christian Buda <chrichri975@gmail.com>"]
channels = ["conda-forge"]
name = "parrot-neuro"
# linux-64 is your workstation + LEONARDO. linux-aarch64 is the ARM cluster.
# osx-arm64 (Apple Silicon) is added on request but UNTESTED (no device) — it
# gets CPU-only JAX (no CUDA on macOS).
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

# This environment is for LOCAL DEVELOPMENT / PROTOTYPING only (the marimo
# notebooks under development/, the future src/parrot_neuro API). It does NOT
# replace the four Docker containers that run the actual Parrot pipeline —
# those stay as-is with their own CGAL/DUNEuro/FastSurfer images.

[tasks]
# `pixi run <name>` — reproducible, discoverable entry points.
# TVB→EEG optimization workbench (imports the tvbeeg/ package). cwd is set so
# the notebook's relative imports resolve; data paths are package-anchored.
nb = { cmd = "marimo edit eeg_optim.py", cwd = "development/tvb-optim_EEG" }
# One-off EEG extraction (.set → EEG/all_data.pkl).
nb-extract = { cmd = "marimo edit eeg_extract.py", cwd = "development/tvb-optim_EEG" }

[dependencies]
# Pinned interpreter: without this, pixi resolves the newest Python (3.14),
# which has no wheels yet for jax/mne. 3.12 matches the Docker containers.
python = "3.12.*"

# Scientific base from conda-forge: these build cleanly here and pixi uses them
# to satisfy the PyPI packages below (so jax doesn't pull a second numpy).
numpy = "*"
scipy = "*"
matplotlib = "*"
mne = "*"
ipykernel = ">=7.3.0,<8"
# marimo caps jedi <0.20, but conda ipython would resolve 0.20 and pixi treats
# the conda solve as a hard pin for the PyPI solve. Pin it here to keep them agreeable.
jedi = "<0.20"
# Loaders for the src/parrot_neuro Subject API (volumes + surfaces). Pulled from
# conda-forge so pixi resolves them against the same numpy as everything else.
nibabel = "*"
trimesh = "*"
pytest = "*"     # runs tests/ (the Subject API smoke test)

[pypi-dependencies]
# Cross-platform pure-Python / wheel deps. tvboptim is built on JAX, so it
# rides on whatever jax build each platform resolves (below).
# marimo comes from PyPI, not conda-forge: conda-forge has no linux-aarch64 build
# past 0.13.6, while the PyPI wheel is py3-none-any and works on all platforms.
marimo = ">=0.23.13,<0.24"
optax = "*"
equinox = "*"
tvboptim = "*"      # your TVB-optim library (PyPI, currently 0.3.1)
# The local Subject API, installed editable so edits under src/ take effect live.
parrot-neuro = { path = ".", editable = true }

# --- JAX: GPU on linux-64, CPU everywhere else -------------------------------
# The `cuda12` extra pulls the CUDA 12 *runtime* libraries as pip packages;
# they run against your system driver (12.8 is fine — a newer driver always
# supports an equal-or-older CUDA 12.x runtime). There is no "cuda12.8" extra:
# the extra is keyed to the CUDA *major* version only.
[target.linux-64.pypi-dependencies]
jax = { version = "*", extras = ["cuda12"] }

# JUPITER (JSC): GH200 / aarch64, glibc 2.34, system modules are CUDA 13, so the
# cuda13 extra matches the site driver. (The linux-64 box is on a 12.8 driver,
# which cannot run a CUDA 13 runtime — hence the two targets differ.)
[target.linux-aarch64.pypi-dependencies]
jax = { version = "*", extras = ["cuda13"] }

[target.osx-arm64.pypi-dependencies]
jax = "*"           # CPU build (no CUDA on macOS)
